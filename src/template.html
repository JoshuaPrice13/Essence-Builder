<title>Essence Registry</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: a registry desk. The active step fills the left pane, a build ledger stays pinned on the right, and every power prints as a LitRPG system window. Rarity glow is the one loud element. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface2:#F4F6F8; --ink:#14212B; --muted:#53626F; --line:#CCD4DB;
  --accent:#0B7A85; --accent-ink:#FFFFFF; --danger:#B3362E;
  --common:#5A6B79; --uncommon:#1F7A48; --rare:#2563C9; --epic:#8238C9; --legendary:#A86900;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1117; --surface:#131C25; --surface2:#0F171F; --ink:#E5ECF1; --muted:#97A7B4; --line:#273542;
    --accent:#3CC4CF; --accent-ink:#06191C; --danger:#F0877F;
    --common:#9BAAB6; --uncommon:#4CC584; --rare:#6EA2FF; --epic:#B684F0; --legendary:#F0B03A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1117; --surface:#131C25; --surface2:#0F171F; --ink:#E5ECF1; --muted:#97A7B4; --line:#273542;
  --accent:#3CC4CF; --accent-ink:#06191C; --danger:#F0877F;
  --common:#9BAAB6; --uncommon:#4CC584; --rare:#6EA2FF; --epic:#B684F0; --legendary:#F0B03A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);padding-inline:16px;padding-block:22px 56px;margin:0}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;justify-content:space-between}
.top h1{font:800 34px/1 var(--f-display);text-transform:uppercase;letter-spacing:.05em}
.top p{color:var(--muted);font-size:13px}
.steps{display:flex;flex-wrap:wrap;gap:4px 14px;font:500 11px/1.6 var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);list-style:none;margin:0;padding:0}
.steps li.done{color:var(--ink)}
.steps li.on{color:var(--accent);font-weight:500;border-bottom:2px solid var(--accent)}
.layout{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:920px){.layout{grid-template-columns:minmax(0,1fr) 300px;align-items:start}.ledger{position:sticky;top:76px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px;min-width:0}
.stage{display:flex;flex-direction:column;gap:18px}
.eyebrow{font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
h2{font:800 30px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.lede{color:var(--muted);max-width:62ch}
.field{display:flex;flex-direction:column;gap:6px;max-width:440px}
.field label{font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.acct{display:grid;gap:6px;max-width:360px;margin:16px 0}
.acct label{font-size:13px;color:var(--muted)}
.mine{display:flex;flex-direction:column;gap:6px}
.savebar{display:flex;justify-content:flex-end;align-items:center;flex-wrap:wrap;gap:8px;margin:-4px 0 12px}
.savebar .notice,.savebar .warn{margin:0;font-size:13px}
.saved{display:flex;flex-direction:column;gap:8px}
.savedrow{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:4px}
.savedrow small{display:block;color:var(--muted)}
input[type=text],input[type=password]{flex:1 1 200px;min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:10px 12px;min-height:44px}
.btn{min-height:44px;padding:9px 18px;border-radius:4px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.small{min-height:36px;padding:5px 12px;font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.notice{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:10px 12px;max-width:62ch}
.err{border:1px solid var(--danger);border-radius:4px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;color:var(--danger)}
.err p{flex:1 1 220px}

/* rank bar */
.ranks{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line)}
.rbtns{display:flex;flex-wrap:wrap;gap:6px}
.rb{min-height:36px;padding:4px 14px;border:1px solid var(--line);border-radius:4px;background:var(--surface);cursor:pointer;font:600 13px var(--f-body)}
.rb:hover{border-color:var(--ink)}
.rb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* rarity */
.r-common{--rar:var(--common);--glow:0px}
.r-uncommon{--rar:var(--uncommon);--glow:4px}
.r-rare{--rar:var(--rare);--glow:9px}
.r-epic{--rar:var(--epic);--glow:15px}
.r-legendary{--rar:var(--legendary);--glow:24px}
.ess-grid{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:699px){.ess-grid .ess:last-child:nth-child(odd){grid-column:1/-1}}
@media (min-width:700px){.ess-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.ess{display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:104px;padding:12px;text-align:left;cursor:pointer;
  background:var(--surface2);border:1.5px solid color-mix(in srgb,var(--rar) 50%,var(--line));border-radius:6px;
  box-shadow:0 0 var(--glow) color-mix(in srgb,var(--rar) 38%,transparent)}
.ess:hover{border-color:var(--rar)}
.ess.sel{background:color-mix(in srgb,var(--rar) 13%,var(--surface));box-shadow:0 0 0 2px var(--rar),0 0 calc(var(--glow) + 6px) color-mix(in srgb,var(--rar) 45%,transparent)}
.ess-rar{font:500 10.5px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.14em;color:var(--rar)}
.ess-name{font:800 27px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;overflow-wrap:anywhere}
.bonded{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.bonded .ess-name{font-size:44px;color:var(--rar)}

/* ability window */
.ability{background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:14px 16px;font-family:var(--f-mono);font-size:13px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ability header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px}
.ability .nm{font-size:16px;font-weight:500;overflow-wrap:anywhere}
.ability .kind{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--rar,var(--accent))}
.ability dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px 14px;margin:0}
.ability dt{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ability dd{margin:0;overflow-wrap:anywhere}
.ability ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.ability li{padding-left:14px;position:relative}
.ability li::before{content:"\2022";position:absolute;left:2px;color:var(--rar,var(--accent))}
.ability footer{align-items:center}
.ability .rr{min-height:30px;padding:2px 10px;font-size:12px;margin-left:auto}
.ability .ic{min-height:30px;min-width:30px;padding:2px 6px;font-size:15px;line-height:1;border:1px solid transparent;border-radius:4px;background:none;cursor:pointer;color:var(--muted);filter:grayscale(1);opacity:.6}
.ability .ic:hover{opacity:1;border-color:var(--line)}
.ability .ic.on{filter:none;opacity:1;color:var(--accent)}
.ability .desc{font-family:var(--f-body);font-size:14px;line-height:1.55}
.ability ul.rks{border-top:1px dashed var(--line);padding-top:8px}
.ability li.rk{padding-left:0}
.ability li.rk::before{content:none}
.rt{display:inline-block;margin-right:8px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 50%,var(--line));border-radius:3px;padding:1px 5px}
.ability footer{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em}
.skel{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border:1px dashed var(--line);border-radius:4px}
.skel b{font:500 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.skel i{display:block;height:11px;border-radius:3px;background:linear-gradient(90deg,var(--line),transparent,var(--line));background-size:200% 100%;animation:sh 1.6s linear infinite}
.skel i:nth-of-type(2){width:82%}.skel i:nth-of-type(3){width:60%}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel i{animation:none}}

/* confluence */
.conf-name{font:800 clamp(44px,9vw,76px)/.95 var(--f-display);text-transform:uppercase;letter-spacing:.03em;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.1em;padding:6px 8px;border:1px solid var(--line);border-radius:3px;color:var(--muted)}
.chip.warn{border-color:var(--danger);color:var(--danger)}
.chip.rar{border-color:color-mix(in srgb,var(--rar) 55%,var(--line));color:var(--rar)}

/* stones */
.cols{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:640px){.cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
.col{border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{font:800 24px/1 var(--f-display);text-transform:uppercase;color:var(--rar);letter-spacing:.03em}
.slot{display:flex;flex-direction:column;gap:8px}
.slot>button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface2);cursor:pointer;font-size:13.5px}
.slot>button:hover{border-color:var(--ink)}
.slot.active>button{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.slot .sn{font:500 10.5px/1 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.slot .empty{color:var(--muted)}
.slot .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.slot .t span:first-child{overflow-wrap:anywhere}
.stones{display:grid;gap:6px;grid-template-columns:repeat(2,minmax(0,1fr))}
.stone{padding:7px 9px;text-align:left;border:1.5px solid var(--line);border-left:4px solid var(--rar,var(--line));border-radius:5px;background:var(--surface2);cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:44px}
.stone:hover{border-color:var(--ink);border-left-color:var(--rar,var(--ink))}
.stone.sel{border-color:var(--accent);border-left-color:var(--rar,var(--accent));background:color-mix(in srgb,var(--accent) 11%,var(--surface))}
.stone span:first-child{text-transform:uppercase}
.stone b{font:800 17px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.03em;overflow-wrap:anywhere}
.stone span{font:500 10px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chooser{border:1px solid var(--accent);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:8px}
.chooser .actions{gap:6px}

/* final */
.final-head{display:flex;flex-direction:column;gap:8px}
.final-title{font:800 clamp(38px,7vw,60px)/.98 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.final-grid{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.final-grid{grid-template-columns:minmax(0,340px) minmax(0,1fr)}}
.rad{width:100%;max-width:360px;height:auto;display:block}
.rad-ring{fill:none;stroke:var(--line);stroke-width:1}
.rad-axis{stroke:var(--line);stroke-width:1}
.rad-poly{fill:color-mix(in srgb,var(--accent) 26%,transparent);stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.rad-dot{fill:var(--accent)}
.rad-lab{fill:var(--muted);font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em}
.lists{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.lists h3,.sec h3{font:500 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.lists ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.sec{display:flex;flex-direction:column;gap:4px}
.roster{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.exp{width:100%;min-height:150px;background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:10px;font:12px/1.5 var(--f-mono)}

/* ledger */
.ledger{display:flex;flex-direction:column;gap:14px}
.ledger h3{font:800 22px/1 var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.lrow{display:flex;flex-direction:column;gap:5px;padding-top:12px;border-top:1px solid var(--line)}
.lrow .ln{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lrow .ln b{font:800 20px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;color:var(--rar,var(--ink))}
.lrow small{font:500 10.5px/1 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.pips{display:flex;gap:5px}
.pip{width:14px;height:6px;border-radius:2px;background:var(--line)}
.pip.on{background:var(--rar,var(--accent))}
.pip.wait{background:color-mix(in srgb,var(--rar,var(--accent)) 40%,var(--line))}
.empty-l{color:var(--muted);font-size:13px}
[hidden]{display:none!important}
.layout.solo{grid-template-columns:minmax(0,1fr)!important}
a.btn{display:inline-flex;align-items:center;text-decoration:none;color:inherit}
.nav{display:flex;flex-wrap:wrap;gap:4px 18px;font:500 12px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.1em}
.nav a{color:var(--muted);text-decoration:none;padding:8px 0;border-bottom:2px solid transparent}
.nav a:hover{color:var(--ink)}
.nav a[aria-current=page]{color:var(--accent);border-color:var(--accent)}
.llm{border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px;max-width:560px}
.llm .row input{flex:1 1 220px}
.sr{position:absolute;left:-9999px}
.warn{color:var(--danger);font-size:13px}
.bgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.bcard{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);color:inherit;text-decoration:none;min-width:0}
.bcard:hover{border-color:var(--accent)}
.bcard h3{font:800 22px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;overflow-wrap:anywhere}
.bcard small{font:500 10.5px/1.3 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pubmeta{font:500 11px/1.4 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
</style>

<div class="wrap">
  <div class="top">
    <h1>Essence Registry</h1>
    <p>Build an essence user from three essences, their confluence and awakening stones.</p>
  </div>
  <nav class="nav" aria-label="Site"><a href="#/" id="nav-build">Builder</a><a href="#/browse" id="nav-browse">Browse builds</a><a href="#/account" id="nav-acct">Sign in</a></nav>
  <ol class="steps" id="steps" aria-label="Progress"></ol>
  <div class="ranks" id="ranks"></div>
  <div class="layout">
    <main class="panel stage" id="stage"></main>
    <aside class="panel ledger" id="ledger" aria-label="Build ledger"></aside>
  </div>
</div>

<script src="https://js.puter.com/v2/"></script>
<script src="config.js"></script>
<script>

DATA.combos.forEach(function(c){COMBO[keyOf(c.e)]=c;c.e.forEach(function(n){(BY_ESS[n]=BY_ESS[n]||[]).push(c);});});

var RESTRICTED={};
['Bone, Death, Magic','Fungus, Growth, Zeal','Corrupt, Dimension, Magic','Corrupt, Dimension, Might','Corrupt, Dimension, Potent','Corrupt, Magic, Void','Death, Myriad, Void','Death, Flesh, Iron','Death, Iron, Life','Flesh, Iron, Myriad','Flesh, Iron, Technology','Flesh, Magic, Water','Flesh, Might, Technology','Flesh, Myriad, Technology','Blood, Hunger, Locust','Death, Hunger, Plant','Bow, Corrupt, Song','Blood, Corrupt, Flesh','Blood, Corrupt, Potent','Corrupt, Feast, Growth','Death, Dimension, Zeal','Death, Potent, Vast','Death, Potent, Void','Balance, Death, Life','Blood, Dimension, Goat','Dimension, Knife, Sin','Hunger, Knife, Sun','Flesh, Sin, Visage','Hunger, Magic, Sin','Corrupt, Death, Serene','Hunger, Moon, Wolf','Death, Dimension, Magic','Bat, Blood, Death','Blood, Bone, Corrupt','Blood, Corrupt, Dark','Blood, Dark, Death','Blood, Death, Duck','Blood, Death, Hunger','Blood, Death, Hunt','Blood, Death, Moon','Blood, Death, Sin','Blood, Death, Snake','Blood, Death, Spider','Blood, Death, Visage','Blood, Death, Wolf','Bone, Corrupt, Dance','Bone, Corrupt, Flesh','Corrupt, Dance, Flesh','Death, Flesh, Hunger','Death, Magic, Sand','Death, Vehicle, Water','Corrupt, Dimension, Void','Flesh, Hunger, Might'
].forEach(function(t){RESTRICTED[keyOf(t.split(', '))]=1;});

var THEMES={
Alchemy:'Brewing, transmutation and elixir-craft; poisons, reagents and liquids.',
Action:'Cinematic action-hero combat: guns, vehicles and fast improvisation.',
Ambush:'Traps and concealment; hard-to-detect snares and prepared kill zones.',
Animate:'Animating the inanimate or the dead: constructs, minions, mind-controlling growths.',
Anzu:'Storm-bird hybrid: winged predator powers and wide-area wind.',
Arsenal:'Conjured weapons and shields that fight on their own.',
Avatar:'Becoming an embodiment: transformation, shapeshifting, summons or a heroic archetype, depending on the essences.',
Battlefield:'Zone manipulation over a whole battlefield; built for mass engagements.',
Behemoth:'Colossal earthbound might: mass, stampede and durability.',
Boundary:'Barriers and wards; excellent against incorporeal, astral and summoned entities.',
Bounty:'Provision and reward: feasts, hunting and the acquisition of resources.',
Cataclysm:'Apocalyptic destruction and mass summoning; a carry set that shows its colours at higher rank.',

Chimera:'Hybrid creature powers: stitched-together animal traits and composite beasts.',

Desolate:'Withering wasteland: draining land, mana and stamina; plagues and deserts.',

Eclipse:'Opposites held in balance: light and dark, life and death.',

Empower:'Absorbing and redirecting force: drain-to-buff, hybrid attacks and self-augmentation.',
Fertile:'Growth, fecundity and nurture.',
Fey:'Glamour, whimsy and illusion; magic that follows its own logic.',
Firebird:'Flame-winged flight and burning radiance.',
Force:'Telekinetic force and physical-magical hybrid strikes.',
Forge:'Smithing and artifice: heat, metal and craft.',
Fortress:'Immovable defence; a bulwark of stone and iron.',
Garuda:'Swift winged might; speed and aerial dominance.',
Gate:'Portals and passage between places; handling astral and incorporeal things.',
Glimeron:'A fire-breathing, venomous, reflective-scaled lure creature.',
Gorgon:'Serpentine coils and a petrifying gaze.',
Griffin:'Predatory aerial might with feline ferocity.',
Guardian:'Protection and support: shielding allies, or a coastal druid guarding land and sea.',

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function rnd(n){return Math.floor(Math.random()*n);}
function pick(a){return a[rnd(a.length)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function wsample(arr,n){
  var out=[],a=arr.slice();
  while(out.length<n&&a.length){
    var tot=0,i;
    for(i=0;i<a.length;i++)tot+=WEIGHT[ESS_RARITY[a[i]]];
    var r=Math.random()*tot;
    for(i=0;i<a.length;i++){r-=WEIGHT[ESS_RARITY[a[i]]];if(r<=0)break;}
    if(i>=a.length)i=a.length-1;
    out.push(a.splice(i,1)[0]);
  }
  return out;
}
function genOptions(names){
  var chosen={};names.forEach(function(n){chosen[n]=1;});
  var avail=POOL.filter(function(n){return !chosen[n];});
  var g=[],set={};
  if(names.length===0){
    g=wsample(avail.filter(function(n){return BY_ESS[n];}),3);
  }else if(names.length===1){
    (BY_ESS[names[0]]||[]).forEach(function(c){c.e.forEach(function(n){if(n!==names[0]&&ESS_RARITY[n]&&!chosen[n])set[n]=1;});});
    g=wsample(Object.keys(set),2);
  }else{
    (BY_ESS[names[0]]||[]).forEach(function(c){if(c.e.indexOf(names[1])>-1)c.e.forEach(function(n){if(!chosen[n]&&ESS_RARITY[n])set[n]=1;});});
    g=wsample(Object.keys(set),2);
  }
  var rest=wsample(avail.filter(function(n){return g.indexOf(n)<0;}),5-g.length);
  return shuffle(g.concat(rest));
}

var RULES='You write abilities for a character builder based on the LitRPG series "He Who Fights With Monsters" (HWFWM).\n'+
'How its magic works: a person bonds up to three essences, each a concept, creature or object such as Duck, Hammer, Fire or Sin. Bonding an essence awakens exactly one ability. Further abilities come from Awakening Stones, which pull an ability toward the stone’s concept. After three essences are bonded, a fourth, the confluence essence, forms from the combination; it awakens one ability and takes four more stones. Every ability grows out of a concept: take the essence or stone fairly literally, and write the thing a person would most expect that concept to do.\n'+
'HWFWM style: abilities are the familiar archetypes of the genre, such as a bolt, lance, cloak, shield, step, sense, buff, curse, aura, familiar, healing or weapon enhancement, tied directly to the concept. They are plain and practical, not clever. Names are short and literal, the concept plus the action, such as "Ember Lance" or "Tide Ward". Write original names; never reuse a name or text from the books. Do NOT add a quirk, twist or gimmick; describe what the ability does and nothing more.\n'+
'STANDALONE RULE: every ability must make complete sense and be fully usable entirely on its own. Never mention, name, refer to or depend on any other ability the user has, and never say it enhances, triggers, empowers or works with another ability. The abilities already listed are only there so you avoid repeating them and can pick compatible imagery.\n'+
'Format: "description" is the ability at Iron rank: 2 to 4 plain sentences in a matter-of-fact system voice, stating exactly what it does, to whom, and how it depends on the user’s attributes. No bullet points, no flavour text, no closing summary.\n'+
'Cost is NEVER a number. Use the relative classifiers the books use: "Very Low", "Low", "Moderate", "High" or "Very High", then the resource, "mana" or "stamina", and add "per second" for sustained or toggled abilities. Examples: "Low mana", "Moderate stamina", "High mana per second". Passives and free abilities use "None". Cooldown and duration may be times, and should vary widely between abilities.\n'+
'RANKS ARE THE HEART OF EVERY ABILITY. In this world an ability gains a new effect at each rank: Iron is the base ability, then Bronze, Silver, Gold and Diamond each add something the ability did not do before. In "ranks", write the new effect gained at each of Bronze, Silver, Gold and Diamond as 1 or 2 plain sentences (at most 30 words) in the same voice as the description. Each must be a genuinely NEW effect: a new capability, a new target or area, a new secondary effect, a new condition it can inflict or resist, or a new way to use it. A bigger number alone does not count, though numbers may accompany the new effect. Each rank’s effect builds on the same ability only, never on a different one, and the strength escalates: Bronze modest, Silver notable, Gold powerful, Diamond dramatic and rank-defining.\n'+
'Reply with ONLY one JSON object, no other text:\n'+
'{"name":"2-3 word ability name","type":"the required type","cost":"e.g. Low mana, Moderate stamina, High mana per second or None","cooldown":"e.g. 12 seconds, 4 minutes, 1 day or none","range":"e.g. 15 metres, self or touch","duration":"e.g. 8 seconds, 1 hour, instant or permanent","description":"2 to 4 plain sentences","ranks":{"bronze":"new effect","silver":"new effect","gold":"new effect","diamond":"new effect"},"short":"one plain sentence of at most 14 words saying what the ability does"}';

/* Every build should tend to hold each ability type; force the missing ones once slots run short. */
function assignType(o){
  if(o.want)return o.want;
  var c={},n=0;
  holders().forEach(function(h){if(h.want){c[h.want]=(c[h.want]||0)+1;n++;}});
  var missing=TKEYS.filter(function(k){return !c[k];});
  var left=TOTAL-n,t;
  if(missing.length&&(missing.length>=left||Math.random()<0.55)){t=pick(missing);}
  else{
    var w=TKEYS.map(function(k){if(k==='perception'&&c[k])return 0;var x=1+(c[k]||0);return 1/(x*x);}),tot=0,i;
    w.forEach(function(x){tot+=x;});
    var r=Math.random()*tot;
    for(i=0;i<w.length;i++){r-=w[i];if(r<=0)break;}

}

function context(kind){

  var rule;
  if(kind==='conf')rule='This confluence ability is the build’s signature. Build it from the concepts of the three essences and the confluence theme, so it could only exist because they met. It must still be a complete ability on its own that never mentions the abilities above.';
  else if(n<3)rule='Treat this as an independent ability.';
  else if(n<8)rule='It may share an element or image with the abilities above, so the build feels coherent. It must never mention them.';
  else rule='It may share elements, imagery or a theme with the abilities above, so the build feels coherent and its abilities suit each other. It must never mention or depend on them.';
  var conf=S.conf?'\nConfluence essence: '+S.conf.name+(S.conf.theme?' ('+S.conf.theme+')':''):'';

/* The player's history: avoid names they have already been given, and match the style of their favourites. */
function memoryPrompt(){

/* Draw on the interplay of the build’s essences, including the confluence. */
function interplay(o,pool){
  var me=o?entName(o):'',others=pool.filter(function(n){return n!==me;});

/* ---------- normalisers ---------- */
function str(v,d){v=(v==null?'':String(v)).trim();return v||d;}
function normCost(c){
  c=str(c,'None');
  if(/^(none|no\b|free|nil|n\/a|-)/i.test(c))return 'None';
  var m=c.match(/very high|very low|extreme|high|moderate|medium|low/i),lv=m?m[0].toLowerCase():'moderate';
  if(lv==='medium')lv='moderate';if(lv==='extreme')lv='very high';
  lv=lv.replace(/\b\w/g,function(x){return x.toUpperCase();});
  var res=/stamina/i.test(c)?'stamina':'mana';
  return lv+' '+res+(/per second|sustain|continu|upkeep|toggle/i.test(c)?' per second':'');
}
function normPower(r,want){
  if(!r||typeof r!=='object'||Array.isArray(r))throw {code:'invalid_json'};
  var d=str(r.description,'');
  if(!d&&Array.isArray(r.effects))d=r.effects.map(function(x){return str(x,'');}).filter(Boolean).join(' ');
  if(!str(r.name,'')||!d)throw {code:'invalid_json'};
  var rk=r.ranks&&typeof r.ranks==='object'?r.ranks:{};
  var ranks=['bronze','silver','gold','diamond'].map(function(k){return str(rk[k],'');});
  var ty=want&&TYPES[want]?want:(TYPES[String(r.type).toLowerCase()]?String(r.type).toLowerCase():'utility');
  return {name:str(r.name,'Unnamed').replace(/^\[|\]$/g,''),type:ty,cost:normCost(r.cost),cooldown:str(r.cooldown,'none'),range:str(r.range,'self'),duration:str(r.duration,'instant'),description:d,ranks:ranks,short:str(r.short,d.split(/(?<=[.!?])\s/)[0]),id:Math.random().toString(36).slice(2,9),rstat:''};
}
function newPower(r,want){var p=normPower(r,want);rememberPower(p);return p;}
function strList(a,n){return (Array.isArray(a)?a:[]).map(function(x){return str(x,'');}).filter(Boolean).slice(0,n);}
function normSummary(r){
  if(!r||typeof r!=='object'||Array.isArray(r))throw {code:'invalid_json'};
  var o={title:str(r.title,'Unnamed Build'),tagline:str(r.tagline,''),playstyle:str(r.playstyle,''),strengths:strList(r.strengths,3),weaknesses:strList(r.weaknesses,2),synergy:str(r.synergy,''),team_role:str(r.team_role,''),rank_outlook:str(r.rank_outlook,'')};
  if(!o.playstyle&&!o.strengths.length)throw {code:'invalid_json'};

}
function errCopy(e){
  switch(e&&e.code){
    case 'not_granted':return 'You are signed out of your AI account. Go back to the first page, sign in, then try again.';
    case 'rate_limited':return 'Your AI account hit a usage limit or is out of credit. Check your Puter usage, then try again.';
    case 'invalid_json':return 'The model’s reply could not be read as an ability. Try again.';
    default:return 'The power could not be written. Try again, or pick another model on the first page.';
  }
}
function replyText(res){
  if(typeof res==='string')return res;
  var c=res&&res.message?res.message.content:(res&&res.text);
  if(typeof c==='string')return c;
  if(Array.isArray(c))return c.map(function(x){return typeof x==='string'?x:((x&&x.text)||'');}).join('');
  return '';
}
function parseReply(res){
  var s=replyText(res).trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'');
  var a=s.indexOf('{'),b=s.lastIndexOf('}');

  try{return JSON.parse(s.slice(a,b+1));}catch(e){throw {code:'invalid_json'};}
}
function mapErr(e){
  var m=String((e&&(e.message||(e.error&&e.error.message)||e.code))||e||'');
  if(/sign|auth|login|permission|401/i.test(m))return {code:'not_granted'};
  if(/limit|quota|credit|fund|insufficient|usage|429/i.test(m))return {code:'rate_limited'};
  return {code:'error'};
}
function call(prompt){
  if(!llmReady())return Promise.reject({code:'not_granted'});

  'Ability: ['+p.name+'] ('+(TYPES[p.type]||TYPES.utility).label+', from '+x.from+')\nCost: '+p.cost+'; cooldown: '+p.cooldown+'; range: '+p.range+'; duration: '+p.duration+'\nIron effect: '+p.description+'\nCharacter: '+S.name+'\nGive a fresh progression that differs from this earlier attempt: '+p.ranks.filter(Boolean).join(' | ')+

  });

  pts.forEach(function(p){out+='<circle class="rad-dot" r="3" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'"/>';});

function auth(path,body,tok){
  var h={apikey:CFG.supabaseKey,'Content-Type':'application/json'};
  if(tok)h.Authorization='Bearer '+tok;
  return fetch(sbBase()+'/auth/v1/'+path,{method:'POST',headers:h,body:body?JSON.stringify(body):undefined}).then(function(r){
    return r.json().catch(function(){return {};}).then(function(j){if(!r.ok)throw j;return j;});

function setSession(j){
  if(!j||!j.access_token||!j.refresh_token){ACC.s=null;ACC.name='';try{localStorage.removeItem(ACC_KEY);}catch(e){}return;}
  ACC.s={at:j.access_token,rt:j.refresh_token,exp:Date.now()+((+j.expires_in||3600)-60)*1000,uid:jwtSub(j.access_token)};
  try{localStorage.setItem(ACC_KEY,JSON.stringify(ACC.s));}catch(e){}

var refreshing=null;
function token(){
  if(!ACC.s)return Promise.resolve('');

    .then(function(j){setSession(j);return ACC.s?ACC.s.at:'';},function(){setSession(null);return '';})
    .then(function(t){refreshing=null;return t;});

}

function parseHash(){
  var h=(location.hash||'').replace(/^#\/?/,'');
  if(h==='browse')ROUTE={name:'browse',id:''};
  else if(h==='account')ROUTE={name:'account',id:''};
  else if(h.indexOf('b/')===0&&UUID.test(h.slice(2)))ROUTE={name:'view',id:h.slice(2)};
  else ROUTE={name:'build',id:''};
}
function onRoute(){
  parseHash();
  if(ROUTE.name==='browse'&&B.status!=='ok'&&B.status!=='loading'){loadList();}
  else if(ROUTE.name==='view'){loadBuild(ROUTE.id);}
  else if(ROUTE.name==='account'&&ACC.s&&ACC.mineStatus==='idle'){loadMine();}
  else if(ROUTE.name==='account'&&ACC.s&&SV.listStatus==='idle'){loadSavedList();}
  render();
  window.scrollTo(0,0);
}
/* Shared builds are untrusted: rebuild every field from validated, length-capped values. */
function cap2(v,n){return str(v,'').slice(0,n);}
function cleanPower(p){
  if(!p||typeof p!=='object')return null;
  var rk=Array.isArray(p.ranks)?p.ranks:[];
  var d=cap2(p.description,1200);if(!d||!cap2(p.name,80))return null;
  return {name:cap2(p.name,80),type:TYPES[p.type]?p.type:'utility',cost:cap2(p.cost,60),cooldown:cap2(p.cooldown,80),range:cap2(p.range,80),duration:cap2(p.duration,80),description:d,ranks:[0,1,2,3].map(function(i){return cap2(rk[i],400);}),short:cap2(p.short,240),id:'',rstat:''};
}
function cleanSlots(a){
  return (Array.isArray(a)?a:[]).slice(0,4).map(function(s){
    var st=s&&s.stone;
    var stone=st&&st.name?{id:0,name:cap2(st.name,40),rarity:(RL[st.rarity]||st.rarity==='unknown')?st.rarity:'common',divine:!!st.divine}:null;
    var pw=stone?cleanPower(s&&s.power):null;
    return {stone:pw?stone:null,power:pw,status:pw?'done':'idle',err:''};
  });
}
function cleanBuild(d,name){
  d=d&&typeof d==='object'?d:{};
  var picks=(Array.isArray(d.picks)?d.picks:[]).slice(0,3).map(function(p){
    var ess=cap2(p&&p.ess,40);
    return {ess:ess,rarity:ESS_RARITY[ess]||'common',power:cleanPower(p&&p.power),status:'done',err:'',slots:cleanSlots(p&&p.slots)};
  }).filter(function(p){return p.ess&&p.power;});
  var c=d.conf&&typeof d.conf==='object'?d.conf:null,conf=null;
  if(c&&cleanPower(c.power)){
    conf={name:cap2(c.name,40)||'Unregistered',names:(Array.isArray(c.names)?c.names:[]).slice(0,3).map(function(x){return cap2(x,40);}),known:!!c.known,restricted:false,holders:[],theme:cap2(c.theme,300),power:cleanPower(c.power),status:'done',err:'',slots:cleanSlots(c.slots)};
  }
  var sm=null;try{sm=normSummary(d.summary);}catch(e){}
  return Object.assign(fresh(),{name:cap2(name,40),picks:picks,conf:conf,summary:sm,sumStatus:sm?'done':'idle',phase:'final',rank:S.rank});
}
function packBuild(){
  function pp(p){return p?JSON.parse(JSON.stringify(p)):null;}
  function sl(a){return a.map(function(s){return {stone:s.stone,power:pp(s.power)};});}
  return {v:3,summary:S.summary,
    picks:S.picks.map(function(p){return {ess:p.ess,rarity:p.rarity,power:pp(p.power),slots:sl(p.slots)};}),
    conf:{name:S.conf.name,names:S.conf.names,known:S.conf.known,theme:S.conf.theme,power:pp(S.conf.power),slots:sl(S.conf.slots)}};
}
function fmtDate(s){try{return new Date(s).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});}catch(e){return '';}}
function cardHtml(b){
  if(!UUID.test(String(b.id)))return '';
  var es=(Array.isArray(b.essences)?b.essences:[]).slice(0,3).map(function(n){return '<span class="chip rar r-'+(ESS_RARITY[n]||'common')+'">'+esc(n)+'</span>';}).join('');
  return '<a class="bcard" href="#/b/'+esc(b.id)+'"><small>'+esc(fmtDate(b.created_at))+'</small><h3>'+esc(b.title||'Untitled build')+'</h3><p>'+esc(b.name)+(b.profiles&&b.profiles.username?' · by '+esc(b.profiles.username):'')+'</p><div class="chips">'+es+'<span class="chip" style="color:var(--accent);border-color:var(--accent)">'+esc(b.confluence)+'</span></div>'+(b.model?'<small>Written by '+esc(b.model)+'</small>':'')+'</a>';
}
function listHtml(){
  var q=B.q.trim().toLowerCase();
  var l=B.list.filter(function(b){return !q||(String(b.name)+' '+(b.title||'')+' '+(b.profiles&&b.profiles.username||'')+' '+b.confluence+' '+(Array.isArray(b.essences)?b.essences.join(' '):'')).toLowerCase().indexOf(q)>-1;});
  if(!l.length)return '<p class="notice">'+(B.list.length?'No builds match that search.':'No builds yet. Be the first to publish one.')+'</p>';
  return '<div class="bgrid">'+l.map(cardHtml).join('')+'</div>';
}
function viewBrowse(){
  var head='<p class="eyebrow">Public registry</p><h2>Browse builds</h2><p class="lede">Builds other people have registered. Open one to see every power and its rank effects.</p>';
  if(!DB_ON)return head+'<p class="notice">The public registry is not connected yet. The site owner needs to add the database details to config.js (see the README).</p>';
  if(B.status==='idle'||B.status==='loading')return head+skeleton('Loading builds…');
  if(B.status==='error')return head+'<div class="err" role="alert"><p>'+esc(B.err)+'</p><button class="btn small" data-act="reload-list">Try again</button></div>';
  return head+'<div class="row"><input type="text" id="bq" placeholder="Search by name, essence or confluence" value="'+esc(B.q)+'" aria-label="Search builds"><button class="btn small" data-act="reload-list">Refresh</button></div><div id="blist">'+listHtml()+'</div>';
}
function viewShared(){
  var back='<div class="actions"><a class="btn" href="#/browse">Back to builds</a></div>';
  if(!DB_ON)return '<p class="notice">The public registry is not connected yet.</p>';
  if(VIEW.status==='loading'||VIEW.status==='idle')return skeleton('Loading build…');
  if(VIEW.status==='error')return '<div class="err" role="alert"><p>'+esc(VIEW.err)+'</p></div>'+back;
  var cb=cleanBuild(VIEW.b.data,VIEW.b.name);cb.exportText=VIEW.exp||'';
  if(!cb.picks.length||!cb.conf||!cb.summary)return '<div class="err" role="alert"><p>That build could not be read.</p></div>'+back;
  var meta='<p class="pubmeta">Published '+esc(fmtDate(VIEW.b.created_at))+(VIEW.b.profiles&&VIEW.b.profiles.username?' by '+esc(VIEW.b.profiles.username):'')+(VIEW.b.model?' · written by '+esc(String(VIEW.b.model).slice(0,60)):'')+'</p>';
  return meta+withBuild(cb,viewFinal);
}
function stageHtml(){
  switch(S.phase){
    case 'essence':return viewEssence();
    case 'confluence':return viewConf();
    case 'stones':return viewStones();
    case 'final':return viewFinal();
    default:return viewName();
  }
}
function confPips(){
  var h='<span class="pip '+(S.conf.status==='done'?'on':'wait')+'"></span>';
  S.conf.slots.forEach(function(s){h+='<span class="pip '+(s.status==='done'?'on':s.status==='pending'?'wait':'')+'"></span>';});
  return h;
}
function ranksHtml(){
  var L=[['all','All'],['iron','Iron'],['bronze','Bronze'],['silver','Silver'],['gold','Gold'],['diamond','Diamond']];
  return '<span class="eyebrow">Power rank</span><div class="rbtns" role="group" aria-label="Power rank shown">'+L.map(function(x){return '<button type="button" class="rb'+(S.rank===x[0]?' on':'')+'" data-act="rank" data-r="'+x[0]+'" aria-pressed="'+(S.rank===x[0])+'">'+x[1]+'</button>';}).join('')+'</div>';
}
function ledgerHtml(){
  var h='<h3>'+(S.name?esc(S.name):'Build ledger')+'</h3>';
  if(!S.picks.length)return h+'<p class="empty-l">Essences, the confluence and awakened abilities will be listed here.</p>';
  S.picks.forEach(function(p){
    var pips='<span class="pip '+(p.status==='done'?'on':'wait')+'"></span>';
    p.slots.forEach(function(s){pips+='<span class="pip '+(s.status==='done'?'on':s.status==='pending'?'wait':'')+'"></span>';});
    h+='<div class="lrow r-'+p.rarity+'"><div class="ln"><b>'+esc(p.ess)+'</b><small>'+RL[p.rarity]+'</small></div><div class="pips" aria-label="Abilities awakened">'+pips+'</div></div>';
  });
  if(S.conf){
    h+='<div class="lrow r-epic" style="--rar:var(--accent)"><div class="ln"><b>'+(S.conf.status==='pending'&&!S.conf.known?'Forming…':esc(S.conf.name))+'</b><small>Confluence</small></div><div class="pips">'+confPips()+'</div></div>';
  }
  return h;
}
function render(){
  var gate=ROUTE.name==='build'&&DB_ON&&!ACC.s;
  var onB=ROUTE.name==='build'&&!gate;
  document.getElementById('steps').hidden=!onB;
  document.getElementById('ledger').hidden=!onB;
  document.getElementById('ranks').hidden=ROUTE.name==='browse'||ROUTE.name==='account'||gate;
  document.querySelector('.layout').classList.toggle('solo',!onB);
  var cur=ROUTE.name==='build'?'nav-build':ROUTE.name==='account'?'nav-acct':'nav-browse';
  ['nav-build','nav-browse','nav-acct'].forEach(function(id){var a=document.getElementById(id);if(id===cur)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  document.getElementById('nav-acct').textContent=ACC.s?(ACC.name||'Account'):'Sign in';
  document.getElementById('steps').innerHTML=stepsHtml();
  document.getElementById('ranks').innerHTML=ranksHtml();
  document.getElementById('stage').innerHTML=ROUTE.name==='browse'?viewBrowse():ROUTE.name==='view'?viewShared():ROUTE.name==='account'||gate?viewAccount():saveBar()+stageHtml();
  document.getElementById('ledger').innerHTML=ledgerHtml();
  save();
}

/* ---------- export ---------- */
function exportText(){
  var m=S.summary,t=[S.name.toUpperCase()];
  if(m){t.push(m.title+(m.tagline?' - '+m.tagline:''));if(m.team_role)t.push('Team role: '+m.team_role);}
  t.push('Essences: '+S.picks.map(function(p){return p.ess;}).join(', ')+(S.conf?' | Confluence: '+S.conf.name:''));
  var pw=function(p,src){
    var a=['','['+p.name+'] - '+(TYPES[p.type]||TYPES.utility).label+' (from '+src+')','Cost: '+p.cost+' | Cooldown: '+p.cooldown+' | Range: '+p.range+' | Duration: '+p.duration,'Iron: '+p.description];
    (p.ranks||[]).forEach(function(x,k){if(x)a.push(RANKS[k+1].charAt(0).toUpperCase()+RANKS[k+1].slice(1)+': '+x);});
    return a.join('\n');
  };
  ents().forEach(function(o,i){
    t.push('\n=== '+(i===3?'Confluence: ':'Essence: ')+entName(o)+' ===');
    if(o.power)t.push(pw(o.power,'awakening'));
    o.slots.forEach(function(s){if(s.power)t.push(pw(s.power,stoneShort(s.stone)));});
  });
  if(m){
    t.push('\n=== Summary ===');
    if(m.playstyle)t.push('Playstyle: '+m.playstyle);
    if(m.strengths.length)t.push('Strengths: '+m.strengths.join('; '));
    if(m.weaknesses.length)t.push('Weaknesses: '+m.weaknesses.join('; '));
    if(m.synergy)t.push('Best combination: '+m.synergy);
  }
  return t.join('\n');
}

/* ---------- actions ---------- */
function chosen(){return S.picks.map(function(p){return p.ess;});}
var ACT={
  suggest:function(){S.nameDraft=randName();S.nameErr='';render();},
  begin:function(){
    var el=document.getElementById('uname');if(el)S.nameDraft=el.value;
    var n=S.nameDraft.trim();
    if(!n){S.nameErr='Enter a name first.';render();return;}
    S.name=n;S.nameErr='';S.phase='essence';S.idx=0;S.options=genOptions([]);S.sel=null;render();
  },
  choose:function(d){S.sel=S.options[+d.i];render();},
  refresh:function(){S.options=genOptions(chosen());S.sel=null;render();},
  bond:function(){
    if(!S.sel)return;
    S.picks.push({ess:S.sel,rarity:ESS_RARITY[S.sel],power:null,status:'pending',err:'',slots:[0,1,2,3].map(function(){return {stone:null,power:null,status:'idle',err:''};})});
    S.sel=null;genEssence(S.picks.length-1);
  },
  reroll:function(){genEssence(S.idx);},
  'retry-ess':function(){genEssence(S.idx);},
  next:function(){
    if(S.idx<2){S.idx++;S.options=genOptions(chosen());S.sel=null;render();}
    else{S.phase='confluence';setupConf();}
  },
  'reroll-conf':function(){genConf();},
  'retry-conf':function(){genConf();},
  'conf-next':function(){S.phase='stones';S.active=null;render();},
  rerank:function(d){genRanks(d.id);},
  rank:function(d){S.rank=d.r;render();var b=document.querySelector('.rb[data-r="'+d.r+'"]');if(b)b.focus();},
  openslot:function(d){S.active={e:+d.e,s:+d.s};S.stoneOpts=stoneOptions();S.stoneSel=null;render();},
  stonepick:function(d){S.stoneSel=+d.i;render();},
  stonereroll:function(){S.stoneOpts=stoneOptions();S.stoneSel=null;render();},
  cancelstone:function(){S.active=null;S.stoneSel=null;render();},
  absorb:function(){
    if(!S.active||S.stoneSel==null)return;
    var a=S.active;ent(a.e).slots[a.s].stone=S.stoneOpts[S.stoneSel];
    S.active=null;S.stoneSel=null;genSlot(a.e,a.s);
  },
  'retry-slot':function(d){genSlot(+d.e,+d.s);},
  toggle:function(d){S.open[d.k]=!S.open[d.k];render();},
  submit:function(){S.phase='final';S.exportText='';if(!S.summary)genSummary();else render();},
  retrysum:function(){genSummary();},
  backstones:function(){S.pub=null;S.phase='stones';S.summary=null;S.sumStatus='idle';S.exportText='';render();},
  copy:function(){
    var t=ROUTE.name==='view'?withBuild(cleanBuild(VIEW.b.data,VIEW.b.name),exportText):exportText();
    var ok=function(){var b=document.querySelector('[data-act="copy"]');if(b)b.textContent='Copied';};
    var fb=function(){if(ROUTE.name==='view')VIEW.exp=t;else S.exportText=t;render();var x=document.getElementById('exp');if(x){x.focus();x.select();}};
    try{navigator.clipboard.writeText(t).then(ok,fb);}catch(e){fb();}
  },
  login:function(){
    if(!puterOk())return;
    AUTH.busy=true;AUTH.err='';render();
    Promise.resolve(window.puter.auth.signIn()).then(refreshAuth).then(loadModels).catch(function(){AUTH.err='Sign-in was cancelled or failed. Try again.';}).then(function(){AUTH.busy=false;render();});
  },
  logout:function(){try{window.puter.auth.signOut();}catch(e){}AUTH.ok=false;AUTH.user='';MEM={seen:[],favs:[],ready:false};render();},
  'reload-list':function(){loadList();},
  publish:function(){
    if(!DB_ON||!S.summary||!S.conf||(S.pub&&(S.pub.status==='pending'||S.pub.status==='done')))return;
    var sid=S.sid;S.pub={status:'pending',id:'',err:''};render();
    sb('builds',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({name:S.name,title:S.summary.title,essences:S.picks.map(function(p){return p.ess;}),confluence:S.conf.name,model:LLM.model,data:packBuild()})})
    .then(function(r){if(sid!==S.sid)return;var id=r&&r[0]&&r[0].id;if(!id||!UUID.test(String(id)))throw 0;S.pub={status:'done',id:id,err:''};B.status='idle';})
    .catch(function(){if(sid!==S.sid)return;S.pub={status:'error',id:'',err:'Could not publish. Try again.'};})
    .then(function(){if(sid===S.sid)render();});
  },
  restart:function(){S=fresh();SV.status='';SV.msg='';render();},
  savebuild:function(){saveBuild();},
  fav:function(d){
    var x=findPower(d.id);if(!x||!MEM.ready)return;
    var p=x.p,k=favKey(p);
    if(isFav(p))MEM.favs=MEM.favs.filter(function(f){return favKey(f)!==k;});
    else MEM.favs=MEM.favs.concat([{name:p.name,type:p.type,description:String(p.description).slice(0,600)}]).slice(-30);
    kvSet('eb-favs',MEM.favs);render();
  },
  vote:function(d){
    var x=findPower(d.id);if(!x||!ACC.s)return;
    var p=x.p,v=d.v==='1'?1:-1,prev={vote:p.vote||0,fbId:p.fbId||''};
    if(p.vbusy)return;
    p.vote=p.vote===v?0:v;p.vbusy=true;render();
    var power={name:p.name,type:p.type,cost:p.cost,cooldown:p.cooldown,range:p.range,duration:p.duration,description:p.description,ranks:p.ranks};
    var req=!p.vote?(prev.fbId?sb('power_feedback?id=eq.'+prev.fbId,{method:'DELETE'}):Promise.resolve()):
      prev.fbId?sb('power_feedback?id=eq.'+prev.fbId,{method:'PATCH',body:JSON.stringify({vote:v})}):
      sb('power_feedback',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({vote:v,power:power,source:String(x.from).slice(0,120),model:String(LLM.model).slice(0,60)})});
    req.then(function(l){if(!p.vote)p.fbId='';else if(!prev.fbId)p.fbId=(l&&l[0]&&l[0].id)||'';})
    .catch(function(){p.vote=prev.vote;p.fbId=prev.fbId;})
    .then(function(){p.vbusy=false;render();});
  },
  opensaved:function(d){
    if(!UUID.test(String(d.id)))return;
    sb('saved_builds?id=eq.'+d.id+'&select=id,data').then(function(l){
      if(!l||!l[0]||!restoreState(l[0].data))throw 0;
      S.saveId=l[0].id;S.sid=Date.now();SV.status='';SV.msg='Opened your saved build.';
      location.hash='#/';render();
    }).catch(function(){S=S||fresh();ACC.err='Could not open that saved build.';render();});
  },
  delsaved:function(d){
    if(!UUID.test(String(d.id)))return;
    var k='s:'+d.id;
    if(ACC.confirm!==k){ACC.confirm=k;render();return;}
    ACC.confirm='';
    sb('saved_builds?id=eq.'+d.id,{method:'DELETE',headers:{Prefer:'return=representation'}})
    .then(function(l){if(!l||!l.length)throw 0;SV.list=SV.list.filter(function(b){return b.id!==d.id;});if(S.saveId===d.id)delete S.saveId;ACC.err='';})
    .catch(function(){ACC.err='Could not delete that saved build. Try again.';}).then(render);
  },
  signin:function(){acctSubmit(false);},
  signup:function(){acctSubmit(true);},
  'acct-mode':function(d){var el=document.getElementById('acc-user');if(el)ACC.draft=el.value.trim();ACC.mode=d.m==='signup'?'signup':'signin';ACC.err='';render();},
  'signout-acct':function(){var t=ACC.s&&ACC.s.at;if(t)auth('logout',null,t).catch(function(){});setSession(null);ACC.mine=[];ACC.mineStatus='idle';ACC.err='';SV={status:'',msg:'',list:[],listStatus:'idle'};delete S.saveId;render();},
  'reload-mine':function(){loadMine();},
  delbuild:function(d){
    if(!UUID.test(String(d.id)))return;
    if(ACC.confirm!==d.id){ACC.confirm=d.id;render();return;}
    ACC.confirm='';
    sb('builds?id=eq.'+d.id,{method:'DELETE',headers:{Prefer:'return=representation'}})
    .then(function(l){if(!l||!l.length)throw 0;ACC.mine=ACC.mine.filter(function(b){return b.id!==d.id;});B.status='idle';if(VIEW.id===d.id)VIEW={status:'idle',id:'',b:null,err:'',exp:''};ACC.err='';})
    .catch(function(){ACC.err='Could not delete that build. Try again.';}).then(render);
  }
};
document.addEventListener('click',function(ev){
  var el=ev.target.closest&&ev.target.closest('[data-act]');
  if(!el||el.disabled)return;
  var f=ACT[el.dataset.act];if(f)f(el.dataset);
});
document.addEventListener('input',function(ev){
  var id=ev.target&&ev.target.id;
  if(id==='uname')S.nameDraft=ev.target.value;
  if(id==='bq'){B.q=ev.target.value;var l=document.getElementById('blist');if(l)l.innerHTML=listHtml();}
});
document.addEventListener('change',function(ev){
  if(ev.target&&ev.target.id==='model'){
    LLM.model=(ev.target.value||'').trim()||'claude-sonnet-5-5';
    try{localStorage.setItem('essence-llm-v1',LLM.model);}catch(e){}
  }
});
window.addEventListener('hashchange',onRoute);
document.addEventListener('keydown',function(ev){if(ev.key==='Enter'&&ev.target&&ev.target.id==='uname')ACT.begin();if(ev.key==='Enter'&&ev.target&&/^acc-(user|pass2?)$/.test(ev.target.id))(ACC.mode==='signup'?ACT.signup:ACT.signin)();});

initAccount().catch(function(){}).then(onRoute);
})();
</script>
